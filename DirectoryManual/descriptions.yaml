# =====================================================================
#  NEXAR Directory Manual: คำอธิบาย (ส่วนที่คนเขียน)  ·  ห้ามลบไฟล์นี้
# =====================================================================
#  ต้นไม้โฟลเดอร์และแผนภาพชั้นของโค้ด “เครื่องสร้างเอง” จากโฟลเดอร์จริงและคำสั่ง import ใน JS
#  โครงสร้างจัดเรียงแบบเดียวกับ NEXBIM เพื่อให้ทุกซอฟต์แวร์ในตระกูล NEX ใช้แผนที่แบบเดียวกัน
#
#  หลังแก้ไฟล์นี้ หรือหลังเพิ่ม / ย้าย / ลบโฟลเดอร์ ให้รัน (ที่โฟลเดอร์ Nexar):
#    python tools/dirmap.py
#    → ตรวจ → สร้าง DirectoryManual/manual.data.js → เปิด directory-manual.html ดูผล
# =====================================================================

paths:
  # ---------------- root ----------------
  - { path: ".", p: "โฟลเดอร์หลักของโปรแกรม NEXAR (PWA + WebXR สำหรับงาน BIM หน้างานในตระกูล NEX)",
      d: "อัปโหลดทั้งโฟลเดอร์ขึ้น GitHub Pages หรือรันด้วย python -m http.server 5173 --directory Nexar" }
  - { path: "README.md", p: "สรุปสั้นๆ ว่า NEXAR คืออะไร โครงสร้างโฟลเดอร์ และวิธีรัน / อัปโหลด" }
  - { path: "index.html", p: "หน้าหลักของแอป PWA (ต้องอยู่ที่ root เพื่อให้ GitHub Pages และ Service Worker ทำงานได้)",
