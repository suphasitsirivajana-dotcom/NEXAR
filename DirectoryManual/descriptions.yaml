proposals:
  - { id: "N01", t: "แพ็กเกจกลาง .nexpack เชื่อม NEXBIM ⇄ NEXAR", s: proposal, where: "src/NEXBridge", layer: "NEXBridge",
      why: "ส่งโมเดลจาก NEXBIM มาเปิดใน NEXAR แบบเบากว่า IFC แต่ยังมี GUID, Category และ UniFormat ครบ",
      design: "ไฟล์ ZIP (.nexpack) รวม manifest.json + model.glb + model.meta.json + issues (BCF 3.0) · GLB Loader อ่าน metadata ให้จิ้มดู UniFormat ได้เหมือน IFC",
      steps: ["กำหนด nex-project.schema.json กลางร่วมกับ NEXBIM", "เพิ่ม .nexpack loader ใน Nexar.Loaders / NEXBridge", "ต่อ Export .nexpack จากฝั่ง NEXBIM"],
      ask: ["ต้องการให้เริ่มจากไฟล์ออฟไลน์ .nexpack ก่อน หรือทำ Local Sync Server บน Wi-Fi พร้อมกันเลย?"] }
  - { id: "N02", t: "นำเข้ารูปถ่ายหน้างานจาก SiteSnap เข้า NEXAR", s: proposal, where: "src/NEXBridge", layer: "NEXBridge",
      why: "รูปที่ถ่ายเร็วๆ ด้วย SiteSnap มีแท็กหมวดงานและ GPS อยู่แล้ว เอามาปักบนแปลน/3D ของ NEXAR ได้เลย",
      design: "อ่าน ZIP จาก SiteSnap (photos.nex.json / index.csv) แล้วแปลง GPS เป็นพิกัดโมเดลด้วย geo.js หรือจับคู่ตามชื่อชั้น/ห้อง",
      steps: ["เพิ่ม photos.nex.json ในการ export ของ SiteSnap", "เพิ่มตัวนำเข้า SiteSnap ZIP ใน NEXAR"],
      ask: ["อยากจัดโครงสร้าง SiteSnap ให้เหมือน NEXBIM/NEXAR และเปลี่ยนชื่อเป็น NEXSnap ด้วยไหม?"] }
  - { id: "N03", t: "แยกชุดข้อมูล Mark (IFC Object) vs Note-Comment + รันเลขกลับ + พิกัดและวัน-เวลาตรวจ", s: done, where: "src/Core/Nexar.Document", layer: "Nexar.Document",
      why: "แยกมาร์ควัตถุสำหรับ Comply/สร้าง Object ใน IFC ออกจาก Note-Comment ที่ไว้อ่านอย่างเดียว ไม่ให้ปนกันเวลาส่งออก และไม่ให้เลขรหัสขาดช่วงเมื่อมีการลบ",
      design: "1) Auto-Renumbering: เมื่อลบมาร์ค ให้ขยับเลขที่เหลือรันต่อกันอัตโนมัติ (แยกตามชุดรหัส) · 2) แยก 2 ชุดข้อมูลชัดเจน: Mark (สร้าง Object เช็คใน IFC/Revit, รหัสชุดเฉพาะ, Export IFC/UniFormat Excel แยก) vs Note-Comment (รวม Comment+Note เป็นชุดเดียวไว้อ่าน/ตรวจงาน, รหัสแยกชุด, Export แยกไฟล์) · 3) ทุกมาร์คบันทึกพิกัด IFC (X,Y,Z) ให้ตรงกับโมเดลที่นำเข้าเพื่อตรวจเช็คทางพิกัดได้ พร้อมระบุวัน-เวลาที่ไปเช็คจริงชัดเจน",
      steps: ["แยก schema/counter และ prefix รหัสระหว่าง Mark (IFC Object) กับ Note-Comment", "เพิ่มฟังก์ชัน renumber เมื่อมีการลบรายการ", "แยกปุ่ม/ไฟล์ Export ระหว่างชุด Mark (IFC/UniFormat) กับชุด Note-Comment", "แสดงพิกัด IFC + วัน-เวลาตรวจชัดเจนในทุกมาร์คและไฟล์ส่งออก"],
      ask: ["รหัสชุด Mark (Object) กับ Note-Comment อยากใช้คำนำหน้าอะไร (เช่น MK-001 vs NT-001)?"] }

