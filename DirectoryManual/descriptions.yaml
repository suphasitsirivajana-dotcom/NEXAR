glossary:
  - { k: "PWA", v: "Progressive Web App: เว็บแอปที่ติดตั้งลงหน้าจอมือถือ/iPad และทำงานออฟไลน์ได้เหมือนแอปจริง", r: "ไม่ต้องผ่าน App Store" }
  - { k: "BCF 3.0", v: "BIM Collaboration Format: มาตรฐานเปิดส่งประเด็นปัญหา (มุมกล้อง + รูป + GUID ชิ้นงาน) ข้ามโปรแกรม BIM", r: "BCF Manager / BIMcollab" }
  - { k: "IFC GlobalId", v: "รหัสประจำตัวชิ้นงาน 22 ตัวอักษร แปลงจาก UUID 128-bit สูตรเดียวกับ NEXBIM และ Revit", r: "IfcGUID" }
  - { k: "Service Worker (sw.js)", v: "สคริปต์เบื้องหลังของเบราว์เซอร์ที่แคชไฟล์แอปไว้ในเครื่อง เพื่อให้เปิดใช้งานหน้างานตอนไม่มีเน็ตได้", r: "Offline cache" }
  - { k: "Geo Anchor", v: "จุดอ้างอิง 1 จุดที่จับคู่พิกัดโมเดล (X, Y, Z) เข้ากับพิกัด GPS (Lat, Lon) และมุมทิศ True North", r: "Survey Point + True North" }
  - { k: "QR Control Point", v: "แผ่น QR พิมพ์ขนาดจริงที่ระบุพิกัดโมเดล ใช้ส่องล็อกตำแหน่งและทิศของกล้องหน้างาน", r: "Survey Control Point" }
