    <path d="M24 14C30 9 39 10 47 16L96 66C101 71 100 80 93 84 86 88 78 86 72 80L24 30C18 24 18 18 24 14Z"/>
  </g>
  <!-- Subtle hairline vertical divider -->
  <line x1="48" y1="5" x2="48" y2="31" stroke="currentColor" stroke-opacity=".26" stroke-width="1"/>
  <!-- NEX (silver-white) -->
  <g transform="translate(62 7.5) scale(.81)" fill="none" stroke="currentColor" stroke-width="2.7" stroke-linecap="square" stroke-linejoin="round">
    <path d="M3 21.5V4.8L26.5 21.2V4.5"/>
    <path d="M54 5h25M54 13h25M54 21h25"/>
    <path d="M106 4.8L131 21.2M131 4.8L106 21.2"/>
  </g>
  <!-- AR (Site Yellow) -->
  <g transform="translate(62 7.5) scale(.81)" fill="none" stroke="var(--nx-ar-ink, #F5C518)" stroke-width="2.7" stroke-linecap="square" stroke-linejoin="round">
    <path d="M157.5 21.5L171 4.8L184.5 21.5M163 16.2h16"/>
    <path d="M212.5 21.5V5h16.5a4.6 4.6 0 0 1 0 9.2h-16.5M227.5 14.2L238.5 21.5"/>
