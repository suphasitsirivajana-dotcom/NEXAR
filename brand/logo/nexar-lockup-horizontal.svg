<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 264 36" role="img" aria-label="NEXAR">
  <!-- 04. Premium Tech Horizontal Lockup: Metallic Ribbon N | NEX (silver-white) + AR (Site Yellow) -->
  <defs>
    <linearGradient id="nxh-l" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#fff" stop-opacity=".42"/><stop offset="55%" stop-color="#fff" stop-opacity=".86"/><stop offset="100%" stop-color="#fff" stop-opacity=".62"/></linearGradient>
    <linearGradient id="nxh-r" x1="0" y1="1" x2="0" y2="0"><stop offset="0%" stop-color="#fff" stop-opacity=".40"/><stop offset="55%" stop-color="#fff" stop-opacity=".84"/><stop offset="100%" stop-color="#fff" stop-opacity=".64"/></linearGradient>
    <mask id="mh-l" maskContentUnits="objectBoundingBox"><rect width="1" height="1" fill="url(#nxh-l)"/></mask>
    <mask id="mh-r" maskContentUnits="objectBoundingBox"><rect width="1" height="1" fill="url(#nxh-r)"/></mask>
  </defs>
  <!-- Ribbon N -->
  <g transform="translate(-2 2) scale(.335)" fill="currentColor">
